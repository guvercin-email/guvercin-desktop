[package]
name = "app"
version = "0.1.0"
description = "guvercin — a local-first desktop mail, calendar, contacts and tasks client"
authors = ["Hidayet Erdem"]
license = "Apache-2.0 WITH Commons-Clause"
repository = "https://github.com/guvercin-email/guvercin-desktop"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tokio = { version = "1.37", features = ["full", "rt-multi-thread"] }
rust-backend = { path = "../../rust-backend" }
tauri-plugin-dialog = "2.6.0"
# Must match rust-backend: both link the same libsqlite3-sys, and a feature
# mismatch would silently pick one build for the whole graph.
libsqlite3-sys = { version = "0.27", features = ["bundled-sqlcipher-vendored-openssl"] }
open = "5.3.2"
arboard = "3.4.0"
tauri-plugin-deep-link = "2"
base64 = "0.22"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
# Mail-client capabilities, the Explorer context-menu verb and the installer's
# uninstall entry all live in the registry (HKCU only — no elevation).
winreg = "0.52"
