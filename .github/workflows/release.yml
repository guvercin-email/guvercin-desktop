name: release

# Tagging `v0.1.0` builds installers on all three platforms and publishes them
# as a GitHub release. Nothing here signs anything: the binaries are unsigned,
# which is what the download section of the README warns users about.
on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed from the Actions tab without moving a tag.
  # A manual run uploads nothing; it only proves the three builds still work.
  workflow_dispatch:

# Needed to create the release and attach the installers to it.
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple silicon, so an unqualified build would leave
          # Intel Macs with nothing. universal-apple-darwin fuses both arches
          # into one .dmg at the cost of a second compile.
          - os: macos-latest
            args: --target universal-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle
          - os: ubuntu-latest
            args: ""
            bundle: target/release/bundle
          - os: windows-latest
            args: ""
            bundle: target/release/bundle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # The universal build links an x86_64 slice as well as the native arm64 one.
      - name: Add Intel target
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      # Same set ci.yml installs — WebKitGTK and the tray backend. SQLCipher is
      # compiled from source by libsqlite3-sys either way.
      - name: Install build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - run: npm install
      - run: npm --prefix frontend install
      # app:build already points tauri at frontend/src-tauri/tauri.conf.json and
      # runs the frontend build first, so this is the same command used locally.
      - name: Build installers
        run: npm run app:build -- ${{ matrix.args }}

      # Only the installers are kept. The raw .app and the unpacked linux tree
      # are build intermediates and would double the size of every release.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p artifacts
          cd "frontend/src-tauri/${{ matrix.bundle }}"
          find . -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          ls -la "$GITHUB_WORKSPACE/artifacts/"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: publish release
    # A tag that only half-builds should not become a release, so this waits on
    # all three and `needs` fails the job if any of them did.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # Not marked prerelease even at 0.x. GitHub excludes prereleases from
          # /releases/latest, and that is the URL the README download button and
          # every download link on guvercin.email point at — flagging the only
          # release there is would send all of them to an empty page. The beta
          # is signalled in the release title and notes instead.
          prerelease: false
          generate_release_notes: true
          body: |
            ## installing

            these builds are **unsigned** — guvercin is an open-source project
            and code-signing certificates are a recurring cost it does not carry
            yet. your operating system will warn you the first time you open it.

            **macOS** — the first launch is refused with "guvercin is damaged and
            can't be opened". it is not damaged; macOS refuses unsigned apps that
            arrived from a browser. right-click the app in Applications, choose
            **Open**, then **Open** again in the dialog. macOS remembers the
            choice, so this is once per install.

            **Windows** — SmartScreen shows "Windows protected your PC". click
            **More info**, then **Run anyway**.

            **Linux** — no warning. make the .AppImage executable
            (`chmod +x`), or install the .deb / .rpm with your package manager.

            if that trade is not one you want to make, you can always
            [build from source](https://github.com/guvercin-email/guvercin-desktop#build-from-source).
